name: StandLock
options:
  bundleIdPrefix: com.yagizdokumaci
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

# The two Sandboxed configurations build the Sandboxed Build: same sources, SANDBOXED
# compilation condition, its own entitlements, bundle id and update feed. Debug and Release
# stay the Standard Build. Select with `xcodebuild -configuration Sandboxed`.
configs:
  Debug: debug
  Release: release
  Sandboxed Debug: debug
  Sandboxed: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: F475N5N7V6
    # Info.plist reads these through $(MARKETING_VERSION) and
    # $(CURRENT_PROJECT_VERSION). Both are placeholders for local builds only:
    # the release workflow overrides MARKETING_VERSION from the git tag and
    # CURRENT_PROJECT_VERSION from its run number. Nothing here needs bumping
    # before a release.
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "16"
    # String Catalog extraction. GENERATE_SYMBOLS stays NO: the catalog holds
    # roughly 80 manually-added sentence keys that would each become a symbol.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO

packages:
  StandLockKit:
    path: StandLockKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  StandLock:
    type: application
    platform: macOS
    sources:
      - path: StandLock
    settings:
      base:
        INFOPLIST_FILE: StandLock/Info.plist
        CODE_SIGN_ENTITLEMENTS: StandLock/StandLock.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.yagizdokumaci.standlock
        PRODUCT_NAME: StandLock
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Info.plist reads these two. The Standard Build keeps the default feed and leaves
        # the Sparkle installer launcher service off; the Sandboxed configurations override.
        SPARKLE_FEED_URL: https://github.com/yagizdo/standlock/releases/latest/download/appcast.xml
        SPARKLE_ENABLE_INSTALLER_LAUNCHER: "NO"
      configs:
        Debug:
          APP_DISPLAY_NAME: StandLock Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.yagizdokumaci.standlock.debug
        Release:
          APP_DISPLAY_NAME: StandLock
        Sandboxed Debug:
          APP_DISPLAY_NAME: StandLock Sandboxed Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.yagizdokumaci.standlock.sandboxed.debug
          CODE_SIGN_ENTITLEMENTS: StandLock/StandLockSandboxed.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SANDBOXED"
          SPARKLE_FEED_URL: https://github.com/yagizdo/standlock/releases/latest/download/appcast-sandboxed.xml
          SPARKLE_ENABLE_INSTALLER_LAUNCHER: "YES"
        Sandboxed:
          APP_DISPLAY_NAME: StandLock Sandboxed
          PRODUCT_BUNDLE_IDENTIFIER: com.yagizdokumaci.standlock.sandboxed
          CODE_SIGN_ENTITLEMENTS: StandLock/StandLockSandboxed.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SANDBOXED"
          SPARKLE_FEED_URL: https://github.com/yagizdo/standlock/releases/latest/download/appcast-sandboxed.xml
          SPARKLE_ENABLE_INSTALLER_LAUNCHER: "YES"
    dependencies:
      - package: StandLockKit
        product: StandLockCore
      - package: StandLockKit
        product: Scheduling
      - package: StandLockKit
        product: Detection
      - package: StandLockKit
        product: Locking
      - package: StandLockKit
        product: Coordination
      - package: Sparkle
        product: Sparkle
